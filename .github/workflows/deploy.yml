name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout root workspace
        uses: actions/checkout@v4
        with:
          repository: kc-fallum/root # Wir checken das Root-Repo aus, damit alle Services als Submodule geladen werden
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }} # BENÖTIGT: GitHub Personal Access Token mit 'repo' Rechten

      - name: Checkout Minecraft Plugins Workspace
        uses: actions/checkout@v4
        with:
          repository: kc-fallum/plugins
          path: game/plugins/bridge
          submodules: recursive
          token: ${{ secrets.GH_PAT }} # Wird benötigt, falls die Plugins privat sind

      - name: Checkout docs repository explicitly
        uses: actions/checkout@v4
        with:
          path: docs # Überschreibt den docs Submodul-Ordner mit dem aktuellsten Code dieses Repos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (for JavaDoc)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build Docs (JavaDoc + TypeDoc + Docusaurus)
        working-directory: ./docs
        run: npm run build:docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
